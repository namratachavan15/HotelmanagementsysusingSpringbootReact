
spring.datasource.url=jdbc:mysql://localhost:3306/hotelmangtsys?useSSL=false
spring.datasource.username=root
server.port=8089
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

auth.token.expirationInMills=172800000
# Set as an environment variable - see run configuration
auth.token.jwtSecret=${JWT_SECRET}

# Razorpay payment gateway - set as environment variables
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ---------------------------------------------------------------------------
# Outgoing mail (booking confirmation emails) - username/password set as
# environment variables, everything else is fixed config
# ---------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# Hotel details used in the confirmation email + invoice PDF
# ---------------------------------------------------------------------------
hotel.name=Taj Hotel
hotel.address=123 Marine Drive, Mumbai, Maharashtra, India
hotel.contact.phone=+91-22-1234-5678
hotel.contact.email=${MAIL_USERNAME}
hotel.mail.from=${MAIL_USERNAME}
hotel.mail.from-name=Taj Hotel

# Invoice pricing - percentages applied on top of (price x nights x rooms)
invoice.tax.percent=12
invoice.discount.percent=0